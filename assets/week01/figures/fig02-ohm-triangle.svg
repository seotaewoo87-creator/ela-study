<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <rect width="560" height="320" fill="#ffffff"/>
  <g stroke="#222" stroke-width="3" fill="#f3f6fb" stroke-linejoin="round">
    <path d="M150,30 L270,250 L30,250 Z"/>
  </g>
  <g stroke="#222" stroke-width="2.5">
    <line x1="88" y1="150" x2="212" y2="150"/>
    <line x1="150" y1="150" x2="150" y2="250"/>
  </g>
  <g font-size="44" font-weight="bold" text-anchor="middle">
    <text x="150" y="128" fill="#1f6feb">V</text>
    <text x="104" y="222" fill="#d1495b">I</text>
    <text x="196" y="222" fill="#2a9d55">R</text>
  </g>
  <text x="150" y="214" font-size="24" text-anchor="middle" fill="#222">×</text>
  <g font-size="20" fill="#222">
    <text x="320" y="80">V = I × R</text>
    <text x="320" y="130">I = V ÷ R</text>
    <text x="320" y="180">R = V ÷ I</text>
  </g>
  <g font-size="14" fill="#555">
    <text x="320" y="220">구할 값을 가리면</text>
    <text x="320" y="240">위·아래 → 나누기</text>
    <text x="320" y="260">옆으로 나란히 → 곱하기</text>
  </g>
  <text x="280" y="300" font-size="13" fill="#555" text-anchor="middle">V: 전압 [V]   I: 전류 [A]   R: 저항 [Ω]</text>
</svg>
