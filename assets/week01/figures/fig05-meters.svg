<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" width="560" height="370" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <rect width="560" height="370" fill="#ffffff"/>
  <g stroke="#222" stroke-width="2.5" fill="none">
    <!-- main loop -->
    <path d="M90,150 V60 H200"/>
    <path d="M250,60 H330 V120"/>
    <path d="M330,200 V270 H90 V176"/>
    <line x1="66" y1="150" x2="114" y2="150"/>
    <line x1="78" y1="176" x2="102" y2="176" stroke-width="5"/>
    <rect x="316" y="120" width="28" height="80" fill="#fff"/>
    <!-- ammeter in series -->
    <circle cx="225" cy="60" r="24" fill="#fff4f4" stroke="#d1495b"/>
    <!-- voltmeter in parallel -->
    <path d="M330,90 H460 V136"/>
    <path d="M460,184 V240 H330"/>
    <circle cx="460" cy="160" r="24" fill="#f2f6ff" stroke="#1f6feb"/>
  </g>
  <g fill="#222">
    <circle cx="330" cy="90" r="4.5"/>
    <circle cx="330" cy="240" r="4.5"/>
  </g>
  <g font-size="22" font-weight="bold" text-anchor="middle">
    <text x="225" y="68" fill="#d1495b">A</text>
    <text x="460" y="168" fill="#1f6feb">V</text>
  </g>
  <g font-size="15" fill="#222">
    <text x="120" y="150">+</text>
    <text x="120" y="186">−</text>
    <text x="270" y="166">부하 R</text>
    <text x="160" y="30" fill="#d1495b">전류계: 회로를 끊고 직렬</text>
    <text x="368" y="266" fill="#1f6feb">전압계: 양단에 병렬</text>
  </g>
  <g font-size="13" fill="#555">
    <text x="20" y="308">• 전류계 내부저항 ≈ 0 → 병렬로 대면 단락!</text>
    <text x="20" y="328">• 전압계 내부저항 ≈ 10 MΩ → 회로에 영향이 거의 없다</text>
    <text x="20" y="348">• 저항 측정은 전원을 끄고, 가능하면 소자를 회로에서 분리해서 잰다</text>
  </g>
</svg>
