<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/>
    </marker>
  </defs>
  <g stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- wires -->
    <path d="M100,150 V70 H250"/>
    <path d="M320,70 H460 V138"/>
    <path d="M460,182 V270 H100 V176"/>
    <!-- battery: long plate + , short plate - -->
    <line x1="76" y1="150" x2="124" y2="150"/>
    <line x1="88" y1="176" x2="112" y2="176" stroke-width="5"/>
    <!-- switch (closed) -->
    <circle cx="250" cy="70" r="4" fill="#222"/>
    <circle cx="320" cy="70" r="4" fill="#222"/>
    <line x1="250" y1="70" x2="316" y2="62"/>
    <!-- lamp: circle with X (IEC) -->
    <circle cx="460" cy="160" r="22"/>
    <line x1="444.4" y1="144.4" x2="475.6" y2="175.6"/>
    <line x1="475.6" y1="144.4" x2="444.4" y2="175.6"/>
  </g>
  <!-- current arrows (conventional current, clockwise) -->
  <g stroke="#d1495b" stroke-width="2" marker-end="url(#arr)">
    <line x1="150" y1="52" x2="210" y2="52"/>
    <line x1="480" y1="205" x2="480" y2="245"/>
    <line x1="300" y1="288" x2="240" y2="288"/>
  </g>
  <g font-size="16" fill="#222">
    <text x="130" y="150">+</text>
    <text x="130" y="186">−</text>
    <text x="20" y="168">전원</text>
    <text x="20" y="188" font-size="13" fill="#555">24 V</text>
    <text x="258" y="102">스위치 S1</text>
    <text x="494" y="156">램프</text>
    <text x="494" y="176" font-size="13" fill="#555">(부하) H1</text>
    <text x="160" y="40" font-size="14" fill="#d1495b">전류 I (관례 방향: + → 부하 → −)</text>
  </g>
  <text x="280" y="325" font-size="13" fill="#555" text-anchor="middle">닫힌 고리(폐회로)가 있어야 전류가 흐른다. 스위치를 열면 고리가 끊겨 I = 0</text>
</svg>
